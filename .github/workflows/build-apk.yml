name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Test, lint and build release APK
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Prepare debug keystore
        run: |
          mkdir -p android
          keytool -genkeypair -v \
            -keystore android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Zipalign
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign with debug keystore
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" sign \
            --ks android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/mp3-player-4.1.0-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose app/build/outputs/apk/release/mp3-player-4.1.0-signed.apk
          ls -la app/build/outputs/apk/release/

      - name: Upload signed APK and keystore
        uses: actions/upload-artifact@v4
        with:
          name: MP3播放器-4.1.0-已签名
          path: |
            app/build/outputs/apk/release/mp3-player-4.1.0-signed.apk
            android/debug.keystore
