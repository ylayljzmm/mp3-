name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app version
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts | head -1)
          [ -n "$VER" ] || { echo "ERROR: could not parse versionName from app/build.gradle.kts"; exit 1; }
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "Resolved app version: $VER"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages (incl. NDK + CMake for FFmpeg build)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Build Media3 FFmpeg decoder extension (software ALAC/FLAC/OGG decode)
        env:
          NDK_PATH: /usr/local/lib/android/sdk/ndk/25.1.8937393
        run: |
          set -e
          echo "::group::Clone media3 + FFmpeg sources"
          git clone --depth 1 --branch 1.2.1 https://github.com/androidx/media.git /tmp/media3
          git clone --depth 1 --branch n6.0 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          echo "::endgroup::"

          FFMPEG_MODULE_PATH="/tmp/media3/libraries/decoder_ffmpeg/src/main"
          echo "::group::Build FFmpeg native libs (alac flac vorbis opus)"
          cd "$FFMPEG_MODULE_PATH/jni"
          ln -sfn /tmp/ffmpeg ffmpeg
          ./build_ffmpeg.sh "$FFMPEG_MODULE_PATH" "$NDK_PATH" linux-x86_64 21 alac flac vorbis opus
          echo "::endgroup::"

          echo "::group::Assemble media3-decoder-ffmpeg AAR (project :lib-decoder-ffmpeg)"
          cd /tmp/media3
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon
          echo "::endgroup::"

          echo "::group::Install AAR into mavenLocal (media3 publish task unavailable here)"
          set +e
          AAR=$(find /tmp/media3 -type f -name '*.aar' 2>/dev/null | grep -i 'decoder.ffmpeg' | head -1)
          if [ -z "$AAR" ]; then
            echo "AAR not found via grep; listing all .aar under /tmp/media3 for debugging:"
            find /tmp/media3 -type f -name '*.aar' 2>/dev/null
            AAR=$(find /tmp/media3 -type f -name '*.aar' 2>/dev/null | head -1)
          fi
          set -e
          echo "Built AAR: $AAR"
          [ -n "$AAR" ] || { echo "ERROR: no AAR was produced by :lib-decoder-ffmpeg"; exit 1; }
          MVN_DIR=~/.m2/repository/androidx/media3/media3-decoder-ffmpeg/1.2.1
          mkdir -p "$MVN_DIR"
          cp "$AAR" "$MVN_DIR/media3-decoder-ffmpeg-1.2.1.aar"
          echo "" | base64 -d > "$MVN_DIR/media3-decoder-ffmpeg-1.2.1.pom"
          echo "::endgroup::"

          echo "::group::Verify installed artifact"
          ls -R ~/.m2/repository/androidx/media3/media3-decoder-ffmpeg/ 2>/dev/null | head -40
          test -f "$MVN_DIR/media3-decoder-ffmpeg-1.2.1.aar" -a -f "$MVN_DIR/media3-decoder-ffmpeg-1.2.1.pom" \
            && echo "OK: media3-decoder-ffmpeg:1.2.1 installed to mavenLocal" \
            || { echo "ERROR: media3-decoder-ffmpeg:1.2.1 not installed"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Test and build release APK (skip lint)
        run: gradle testDebugUnitTest assembleRelease --no-daemon -x lintDebug

      # 签名证书固定在仓库 signing/debug.p12，保证每次构建签名一致，
      # 否则每次生成的证书都不同，车机覆盖安装会报「应用未安装」。
      - name: Prepare signing keystore
        run: |
          test -f signing/debug.p12 || { echo "ERROR: signing/debug.p12 missing"; exit 1; }
          ls -l signing/debug.p12

      - name: Zipalign
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign with fixed keystore
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" sign \
            --ks signing/debug.p12 \
            --ks-type PKCS12 \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/mp3-player-${{ env.VERSION_NAME }}-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose app/build/outputs/apk/release/mp3-player-${{ env.VERSION_NAME }}-signed.apk
          ls -la app/build/outputs/apk/release/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MP3播放器-${{ env.VERSION_NAME }}-已签名
          path: app/build/outputs/apk/release/mp3-player-${{ env.VERSION_NAME }}-signed.apk
