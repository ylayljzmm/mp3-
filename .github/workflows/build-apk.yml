name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages (incl. NDK + CMake for FFmpeg build)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Build Media3 FFmpeg decoder extension (software ALAC/FLAC/OGG decode)
        env:
          NDK_PATH: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          set -e
          echo "::group::Clone media3 + FFmpeg sources"
          git clone --depth 1 --branch 1.2.1 https://github.com/androidx/media.git /tmp/media3
          git clone --depth 1 --branch n6.0 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          echo "::endgroup::"

          FFMPEG_MODULE_PATH="/tmp/media3/libraries/decoder_ffmpeg/src/main"
          echo "::group::Build FFmpeg native libs (alac flac vorbis opus)"
          cd "$FFMPEG_MODULE_PATH/jni"
          ln -sfn /tmp/ffmpeg ffmpeg
          ./build_ffmpeg.sh "$FFMPEG_MODULE_PATH" "$NDK_PATH" linux-x86_64 24 alac flac vorbis opus
          echo "::endgroup::"

          echo "::group::Assemble + publish media3-decoder-ffmpeg (project :lib-decoder-ffmpeg) to mavenLocal"
          cd /tmp/media3
          ./gradlew :lib-decoder-ffmpeg:assembleRelease publishToMavenLocal \
            -x lint -x lintVitalRelease -x spotlessCheck -x check --no-daemon
          echo "::endgroup::"

          echo "::group::Verify published artifact"
          ls -R ~/.m2/repository/androidx/media3/media3-decoder-ffmpeg/ 2>/dev/null | head -40
          test -f ~/.m2/repository/androidx/media3/media3-decoder-ffmpeg/1.2.1/media3-decoder-ffmpeg-1.2.1.aar \
            && echo "OK: media3-decoder-ffmpeg:1.2.1 published" \
            || { echo "ERROR: media3-decoder-ffmpeg:1.2.1 not published"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Test and build release APK (skip lint)
        run: gradle testDebugUnitTest assembleRelease --no-daemon -x lintDebug

      - name: Prepare debug keystore
        run: |
          mkdir -p android
          keytool -genkeypair -v \
            -keystore android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Zipalign
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign with debug keystore
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" sign \
            --ks android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/mp3-player-4.2.0-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose app/build/outputs/apk/release/mp3-player-4.2.0-signed.apk
          ls -la app/build/outputs/apk/release/

      - name: Upload signed APK and keystore
        uses: actions/upload-artifact@v4
        with:
          name: MP3播放器-4.2.0-已签名
          path: |
            app/build/outputs/apk/release/mp3-player-4.2.0-signed.apk
            android/debug.keystore
